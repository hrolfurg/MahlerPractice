<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Mahler 8 – Login</title>
  <link rel="icon" type="image/x-icon" href="{{ url_for('static', filename='favicon.ico') }}">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body { background: #1a1a2e; }
    .login-card {
      max-width: 400px;
      margin: 10vh auto;
      border: none;
      border-radius: 1rem;
      box-shadow: 0 8px 32px rgba(0,0,0,0.4);
    }
    .card-header {
      background: #16213e;
      color: #e2c97e;
      border-radius: 1rem 1rem 0 0 !important;
      text-align: center;
      padding: 1.5rem;
    }
    .card-header h4 { margin: 0; font-weight: 600; letter-spacing: 1px; }
    .card-header small { color: #a0a0b0; font-size: 0.85rem; }
  </style>
</head>
<body>
  <div class="container">
    <div class="card login-card">
      <div class="card-header">
        <h4>Mahler Symphony No. 8</h4>
        <small>Choir Practice Portal</small>
      </div>
      <div class="card-body p-4">
        {% if error %}
        <div class="alert alert-danger alert-dismissible fade show py-2" role="alert">
          {{ error }}
          <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
        </div>
        {% endif %}
        <form method="post">
          <div class="mb-3">
            <label for="username" class="form-label">Username</label>
            <input type="text" class="form-control" id="username" name="username"
                   autocomplete="username" autofocus required>
          </div>
          <div class="mb-3">
            <label for="password" class="form-label">Password</label>
            <input type="password" class="form-control" id="password" name="password"
                   autocomplete="current-password" required>
          </div>
          <div class="d-grid mt-4">
            <button type="submit" class="btn btn-warning fw-semibold">Sign In</button>
          </div>
        </form>
      </div>
    </div>
  </div>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
